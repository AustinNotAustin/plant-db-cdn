services:
  mock-s3:
    build: .
    container_name: mock-s3
    ports:
      - "${SRV_MOCK_S3_PORT}:${SRV_MOCK_S3_PORT}"
    volumes:
      - .:/app
      - ./.env:/app/.env
      - ./s3_buckets:/app/s3_buckets
    environment:
      - SRV_MOCK_S3_PORT=${SRV_MOCK_S3_PORT}
      - SRV_MOCK_S3_URL=${SRV_MOCK_S3_URL}
      - S3_STORAGE_ROOT=${S3_STORAGE_ROOT:-s3_buckets}
      - S3_DEFAULT_PUBLIC_BUCKET=${S3_DEFAULT_PUBLIC_BUCKET:-s3_longterm}
      - AWS_S3_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID}
      - AWS_S3_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY}
    networks:
      - mock-aws-mesh

networks:
  mock-aws-mesh:
    name: ${MOCK_AWS_NETWORK_NAME:-mock-aws-mesh}
